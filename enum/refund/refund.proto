syntax = "proto3";

// 定义包名
package refund;
option go_package = "./enum/refund";

enum Status {
  Status_UNKNOWN = 0;
  // 初始化
  Created = 1;
  // 预支付,创建支付订单后的状态，等待用户完成支付
  Pending = 2;
  // 成功
  Success = 3;
  // 失败
  Failed = 4;
  // 异常
  Abnormal = 5;
  Closed = 6;
  Cancel = 7;
}

// ORIGINAL: 原路退款
//
//BALANCE: 退回到余额
//
//OTHER_BALANCE: 原账户异常退到其他余额账户
//
//OTHER_BANKCARD: 原银行卡异常退到其他银行卡(发起异常退款成功后返回)
enum RefundChannel {
  RefundChannel_UNKNOWN = 0;
  ORIGINAL = 1;
  BALANCE = 2;
  OTHER_BALANCE = 3;
  OTHER_BANKCARD = 4;
}