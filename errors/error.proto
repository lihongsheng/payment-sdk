
syntax = "proto3";

// 定义包名
package errors;
import "errors/errors.proto";

// 多语言特定包名，用于源代码引用
option go_package = "./errors";

enum ErrorReason {
  // 设置缺省错误码
  option (errors.default_code) = 500;

  // 重复请求
  DUPLICATE_REQUEST = 0 [(errors.code) = 400];
  // 为某个枚举单独设置错误码业务错误
  UNAUTHORIZED = 1 [(errors.code) = 401];
  SIGN_ERROR = 2 [(errors.code) = 401];
  FORBIDDEN = 3 [(errors.code) = 403];
  NOT_FOUND = 4 [(errors.code) = 404];
  NOT_ACCEPTABLE = 5 [(errors.code) = 404];
  INVALID_REQUEST = 6 [(errors.code) = 411];
  LIMITED = 7 [(errors.code) = 429];
  SYSTEM_ERROR = 8 [(errors.code) = 500];
  // 参数错误 appid 和 mchid 不匹配
  APPID_MCHID_NOT_MATCH = 9 [(errors.code) = 400];
  // 商户好不存在
  MCH_NOT_EXISTS = 10 [(errors.code) = 400];
  // 参数错误
  PARAM_ERROR = 11 [(errors.code) = 400];
  // 参数错误
  NO_SUPPORT = 12 [(errors.code) = 400];
  // 参数错误
  TIME_OUT = 13 [(errors.code) = 500];
  // 重试
  RETRY_SYSTEM_ERROR = 14 [(errors.code) = 500];
}
